[project]
name = "mailflow-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "anthropic>=2.10.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "celery>=5.4",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "nh3>=0.3.8",
    "packaging>=26.3",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "redis>=5",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "N", "PT", "C4", "T20"]
ignore = ["S101", "B008", "RUF012", "S105", "S106", "RUF001", "RUF003", "SIM105", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "PT018", "PT006", "PT007", "PT011", "PT012", "E501", "B017", "SIM117", "PT022"]
"migrations/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "nh3.*", "argon2.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --tb=short --show-capture=no -p no:logging"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/infrastructure/celery/*"]
