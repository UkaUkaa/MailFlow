# Shared by the HTTP (local) and HTTPS (production) server blocks.

client_max_body_size 30m;          # 25 MB of attachments + multipart overhead
client_body_timeout 60s;
keepalive_timeout 65s;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# img-src allows https: because sandboxed email frames inherit this policy; each frame
# narrows it again and only opens it when the user chooses to show remote images.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-sent chain
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;

location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
}

# Authentication endpoints get a tight edge rate limit in addition to application limits.
location /api/v1/auth/ {
    limit_req zone=auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://backend;
}

location /api/ {
    limit_req zone=api burst=120 nodelay;
    limit_req_status 429;
    proxy_request_buffering on;
    # API responses set their own strict CSP; do not replace it.
    proxy_pass http://backend;
}

location / {
    # proxy_set_header is not inherited once a location sets its own, so repeat them all.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://frontend;
}
