# Local / all-in-one stack: plain HTTP on port 8080 inside the container.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    access_log /dev/stdout;

    # Writable paths for the unprivileged user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream backend  { server backend:8000;  keepalive 16; }
    upstream frontend { server frontend:3000; keepalive 16; }

    server {
        listen 8080 default_server;
        server_name _;
        include /etc/nginx/common.conf;
    }
}
