# Production overrides:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires ENVIRONMENT=production, an https APP_BASE_URL, real SMTP settings and TLS
# certificates in infra/nginx/certs (fullchain.pem, privkey.pem).
services:
  backend:
    environment:
      ENVIRONMENT: production
  celery_worker:
    environment:
      ENVIRONMENT: production
  celery_beat:
    environment:
      ENVIRONMENT: production
  migrate:
    environment:
      ENVIRONMENT: production
  nginx:
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/common.conf:/etc/nginx/common.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports: !override
      - "80:8080"
      - "443:8443"
  mailpit:
    profiles: ["never"]
