# Local development / test dependencies only. Ports are bound to loopback.
# Usage: docker compose -f docker-compose.dev.yml up -d
name: mailflow-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mailflow_owner
      POSTGRES_PASSWORD: dev_owner_password
      POSTGRES_DB: mailflow
      MAILFLOW_APP_PASSWORD: dev_app_password
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow_owner -d mailflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:63799:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:18025:8025", "127.0.0.1:11025:1025"]
  # Real IMAP + SMTP server for the IMAP adapter's integration tests (GreenMail, in-memory,
  # nothing persisted). Loopback only. It presents the test-only certificate from
  # infra/greenmail (a throwaway key committed on purpose), which the tests trust through
  # MAIL_TLS_CA_FILE; the backend reaches loopback only through SSRF_ALLOW_PRIVATE_NETWORKS.
  # Both switches are refused outside ENVIRONMENT=test. Never part of the production stack.
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.tls.keystore.file=/tls/greenmail.p12
        -Dgreenmail.tls.keystore.password=changeit
    volumes:
      - ./infra/greenmail/greenmail.p12:/tls/greenmail.p12:ro
    ports:
      - "127.0.0.1:13143:3143"
      - "127.0.0.1:13993:3993"
      - "127.0.0.1:13025:3025"
      - "127.0.0.1:13465:3465"
      - "127.0.0.1:18081:8080"
volumes:
  dev_pgdata:
